name: Autofill Contribution Graph

on:
  schedule:
    - cron: "0 12 * * *" # Runs automatically once every day at 12:00 PM
  workflow_dispatch:      # Allows you to trigger it manually anytime

jobs:
  backfill-commits:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: bcanseco/github-contribution-graph-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_EMAIL: bushra.f.work@gmail.com
          MAX_DAYS: 1
          MIN_COMMITS_PER_DAY: 1
          MAX_COMMITS_PER_DAY: 4
